input_epubs: []
schema_paths:
  - schemas/characters.yaml
  - schemas/world.yaml
prompt_templates:
  - prompts/base.md
  - prompts/retry_format.md
  - prompts/retry_schema.md
workspace_root: workspace
concurrency:
  enable_parallel_tasks: true
  task_unit: epub_schema
  max_workers: 4
model:
  provider: openai
  name: gpt-4.1
  streaming: true
  base_url: https://api.openai.com/v1
  # api_key 可为空：自建 / Ollama / vLLM / LM Studio 等无鉴权端点不必填。
  # 非空时自动加 `Authorization: Bearer <key>`；要换别家写法请在 extra_headers 里覆盖。
  api_key: <KEY>
  # dry_run: true 时不发网络请求，用离线 Echo 客户端打通流程（旧行为是靠 api_key 为空触发）
  dry_run: false

  # 追加/覆盖到 /chat/completions 请求体的字段（深合并）
  # - dict 递归合并；list / 标量整体覆盖
  # - 值写 null 表示从默认请求体中删除该键
  extra_body: {}
  # extra_body:
  #   reasoning_effort: null        # 删掉默认的 reasoning_effort
  #   thinking: {type: enabled}     # 显式打开思考
  #   top_k: 20
  #   chat_template_kwargs: {enable_thinking: false}
  #   parallel_tool_calls: false
  #   search: {enable: true}

  # 追加/覆盖请求头（键大小写不敏感）
  # - 值写 null 表示删除该默认头
  # - bool / 数字 / 对象会自动转成字符串
  extra_headers: {}
  # extra_headers:
  #   Authorization: null            # 去掉默认 Bearer 头
  #   x-api-key: <KEY>               # 改用别家鉴权写法
  #   api-key: <KEY>
  #   anthropic-version: "2023-06-01"
  #   X-Title: epub2dict
  #   User-Agent: null               # 连默认 UA 也不发
runtime:
  resume: true
  retry_count: 3
  retry_backoff_seconds: 3
progress:
  emit_console_progress: true
batching:
  enable_multi_chapter: true
  max_input_tokens: 12000
  prompt_overhead_tokens: 1500
  reserve_output_tokens: 3000
  allow_oversize_single_chapter: true
  split_on_failure: true
  split_after_retry_exhausted: true
  enable_checkpoint: false
  checkpoint_every_n_chapters: 10

# 抽取管线模式
#   legacy: 让 LLM 输出完整 YAML，由程序侧合并（旧行为，未设置时的默认值）
#   agent : 提供 batch_edit 等编辑工具，由 LLM 批量修改 output.yaml（推荐，见下）
pipeline:
  mode: legacy

# 会话式抽取配置（仅在 pipeline.mode=agent 时生效）
session:
  enabled: true
  # 上下文预算，超过后开启新一轮 generation（0 或负数表示不旋转）
  max_context_tokens: 64000
  # 单个段落允许的最大模型往返轮数（含完成回复），超过即视为段落失败
  # batch_edit 内的多项编辑只占一次工具调用，不逐项消耗轮数
  max_tool_rounds_per_segment: 12
  # 旋转点与 checkpoint 窗口对齐（超出硬上限时会立即旋转）
  rotate_on_checkpoint: true
  # 把消息时间线落盘，支持崩溃后恢复
  persist_messages: true
  # 实体索引摘要粒度: compact | full
  index_detail: compact

# 编辑工具开关
tools:
  # 是否允许 remove_field / remove_entry（默认隐藏，避免误删）
  allow_remove: false
  # 是否允许整体覆写文件（默认关闭：一旦开启就会退回「输出全文」）
  allow_full_write: false
  # 新建条目前的近似重名检查
  near_duplicate_check: true

# 提示缓存配置
cache:
  # implicit: DeepSeek / OpenAI 自动前缀缓存
  # explicit: Anthropic 显式 cache_control 断点
  mode: implicit
  # 是否把 cache hit/miss token 数写入 progress
  log_hit_tokens: true
# 黑名单关键字列表：如果LLM输出包含这些关键字，则视为错误并触发重试
blacklist_keywords: []
# blacklist_keywords:
#   - "抱歉"
#   - "我无法"
#   - "作为AI"

# 智能数组合并配置
merge:
  similarity_threshold: 0.6  # 相似度阈值，范围0.0-1.0
  # 字段权重配置：key为字段路径（支持嵌套路径用点号分隔），value为权重（默认为1.0）
  # 权重越高，该字段对整体相似度的影响越大
  field_weights: {}
  # field_weights:
  #   name: 2.0           # name字段权重为2.0
  #   title: 1.5          # title字段权重为1.5
  #   person.name: 3.0    # 嵌套字段权重
